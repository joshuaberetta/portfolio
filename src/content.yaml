# Site content. Edit this file to update the site without touching code.
#
# `image` and `file` values are file names inside assets/ (spaces are fine).
# The build fails if a named file is missing, so a broken link or image
# never reaches the live site.

site:
  title: "Joshua Beretta"
  # Where `wget cv.pdf` sends people for the latest CV.
  cv: "https://cv.joshuaberetta.com"

# The header next to the pixel avatar.
header:
  image: "profile-picture.jpg"
  name: "Joshua Beretta"
  version: "v2026.11"
  subtitle: "Humanitarian Programs Lead · Kobo"
  path: "~/joshuaberetta.com"

# The highlighted line under the header.
banner: "Humanitarian tech, data collection & responsible AI · me@joshuaberetta.com"

# Typed into the prompt and answered when the page first loads.
intro:
  prompt: "who is joshua?"
  section: about

# Window name in the tmux status bar.
window: "joshua"

# The menu. Each section becomes an option; choosing it "streams" the body.
#
# body is light markdown:
#   **bold**  *italic*  `code`  [text](https://link)
#   lines starting with "- " are bullets, a blank line is a paragraph break
# files (optional) are downloads listed after the body; `file` is in assets/.
sections:
  - key: about
    label: "About"
    hint: "who I am and what I do"
    body: |
      I'm **Joshua Beretta**, a humanitarian technology professional based *nowhere* (I live out of a backpack, wherever the work takes me), trying to do some good in this chaotic world we live in.

      I started out as a mechanical engineer, became a core backend developer at [Kobo](https://www.kobotoolbox.org), and now lead Kobo's humanitarian programs: partnerships with UN agencies, INGOs and governments working in crisis contexts.

      **What I work on:**
      - Humanitarian response and remote deployments for data collection
      - Technical training across Africa, Latin America and Asia, in English and Spanish
      - Responsible use of AI in humanitarian data collection

  - key: experience
    label: "Experience"
    hint: "roles at Kobo and before"
    body: |
      **Kobo** · remote
      - **Humanitarian Programs Lead** · 2026 – now
      - **Humanitarian Project Coordinator** · 2023 – 2026
      - **Project Coordinator** · 2022 – 2023
      - **Backend Developer** · 2020 – 2022

      **Aurecon Group** · Cape Town
      - **Mechanical Engineer** · 2018 – 2020

  - key: deployments
    label: "Deployments"
    hint: "emergency responses"
    body: |
      **DRC / Uganda** · Ebola response · 2026 – now
      - Remote support for the Bundibugyo Ebola outbreak response in Ituri Province
      - WHO rapid qualitative assessment forms in French, Congolese Swahili and Lingala
      - Proof-of-concept WhatsApp AI interviewer bot for primary data collection

