    body: |
      I'm **Joshua Beretta**, a humanitarian technology professional based *nowhere* (I live out of a backpack, wherever the work or life takes me), trying to do some good in this chaotic world we live in.

      I started out as a mechanical engineer, became a core backend developer at [Kobo](https://www.kobotoolbox.org), and now lead Kobo's humanitarian programs: partnerships with UN agencies, INGOs and governments working in crisis contexts.

      **What I work on:**
      - Humanitarian response and remote deployments for data collection
      - Technical training across Africa, Latin America and Asia, in English and Spanish
      - Responsible use of AI in humanitarian data collection

